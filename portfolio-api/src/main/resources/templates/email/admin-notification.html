<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>New Contact Form Submission</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            line-height: 1.6;
            color: #333;
            background-color: #f5f5f5;
            padding: 40px 20px;
        }
        .email-container {
            max-width: 650px;
            margin: 0 auto;
            background: white;
            border-radius: 16px;
            overflow: hidden;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.1);
        }
        .content {
            padding: 50px 45px;
            background: white;
        }
        .greeting {
            font-size: 32px;
            color: #1a202c;
            margin-bottom: 40px;
            font-weight: 300;
            letter-spacing: -0.8px;
            line-height: 1.3;
        }
        .greeting strong {
            font-weight: 700;
            color: #667eea;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        .info-section {
            background: white;
            border-radius: 16px;
            padding: 0;
        }
        .info-row {
            display: flex;
            align-items: center;
            margin-bottom: 28px;
            padding: 22px 28px;
            background: linear-gradient(135deg, #fafbfc 0%, #f7f9fc 100%);
            border-radius: 14px;
            border: 2px solid #e8ecf1;
            transition: all 0.3s ease;
        }
        .info-row:hover {
            border-color: #667eea;
            transform: translateX(4px);
            box-shadow: 0 4px 16px rgba(102, 126, 234, 0.12);
        }
        .info-row:last-child {
            margin-bottom: 0;
        }
        .info-icon {
            font-size: 32px;
            margin-right: 24px;
            flex-shrink: 0;
            width: 56px;
            height: 56px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border-radius: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 6px 20px rgba(102, 126, 234, 0.35);
        }
        .info-content {
            flex: 1;
        }
        .info-label {
            font-weight: 800;
            color: #667eea;
            font-size: 9px;
            text-transform: uppercase;
            letter-spacing: 1.2px;
            margin-bottom: 6px;
            display: block;
        }
        .info-value {
            font-size: 16px;
            color: #1a202c;
            word-wrap: break-word;
            word-break: break-word;
            line-height: 1.5;
            font-weight: 600;
        }

        @media (min-width: 640px) {
            .info-label {
                font-size: 10px;
                letter-spacing: 1.5px;
                margin-bottom: 10px;
            }
            .info-value {
                font-size: 20px;
            }
        }
        .info-value a {
            color: #667eea;
            text-decoration: none;
            font-weight: 700;
            transition: all 0.3s ease;
            border-bottom: 2px solid transparent;
        }
        .info-value a:hover {
            color: #764ba2;
            border-bottom-color: #764ba2;
        }
    </style>
</head>
<body>
    <div class="email-container">
        <div class="content">
            <div class="greeting">
                Hi <strong th:text="${ADMIN_NAME}">Admin</strong>,
            </div>

            <div class="info-section">
                <div class="info-row">
                    <div class="info-content">
                        <span class="info-label">Name</span>
                        <div class="info-value" th:text="${userName}">John Doe</div>
                    </div>
                </div>

                <div class="info-row">
                    <div class="info-content">
                        <span class="info-label">Email</span>
                        <div class="info-value">
                            <a th:href="'mailto:' + ${userEmail}"
                               th:text="${userEmail}">
                                john@example.com
                            </a>
                        </div>
                    </div>
                </div>

                <div class="info-row">
                    <div class="info-content">
                        <span class="info-label">Message</span>
                        <div class="info-value" th:text="${message}">
                            This is the message content that will be displayed here.
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
