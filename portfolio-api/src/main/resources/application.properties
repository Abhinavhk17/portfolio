spring.application.name=portfolio-api
spring.data.mongodb.database=portfolio
spring.data.mongodb.uri=mongodb://localhost:27017/portfolio
server.port=8082

#logging
logging.level.org.springframework.web=DEBUG

#cloudninary
cloudinary.cloud_name=${CLOUDINARY_CLOUD_NAME}
cloudinary.api_key=${CLOUDINARY_API_KEY}
cloudinary.api_secret=${CLOUDINARY_API_SECRET}

# Email Configuration
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${EMAIL_USERNAME}
spring.mail.password=${EMAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

# Admin email for receiving contact form submissions
app.admin.email=${ADMIN_EMAIL}
app.admin.name=${ADMIN_NAME}

